[Theme]
name = Custom Theme
version = 1.0
author = Ninawe dev.
description = Standard dark theme

[Global]
font_family = resources\font\font.ttf
font_color = #FFFFFF
font_size = 11
font_shadow = True

[Desktop.System]
work_area_padding_top = 0
work_area_padding_right = 0
work_area_padding_bottom = 0
work_area_padding_left = 0

[Desktop]
wallpaper_path = resources\wallpapers
wallpaper_mode = cover
wallpaper_carousel = False
carousel_interval_min = 0.05
carousel_shuffle = False
wallpaper_transition_ms = 500
window_margin_x = 0
window_margin_y = 0
group_selection_background = #3c0078d7
group_selection_border = #500066cc
group_selection_border_width = 1
group_selection_border_radius = 0

[Desktop.Icon]
bitmap_size = 48
item_width = 80
item_height = 90
spacing_x = 0
spacing_y = 0
icon_label_status = True
icon_label_font_family = Segoe UI
icon_label_font_size = 11
icon_label_compensator = 1
icon_container_border = 1
icon_container_border_radius = 0
icon_hover_background = #500078d7
icon_hover_border = #500066cc
icon_selected_background = #5a0078d7
icon_selected_border = #5a0066cc
icon_hover_on_selected_background = #640078d7
icon_hover_on_selected_border = #640066cc
icon_drop_background = #6e0078d7
icon_drop_border = #6e0066cc

[ContextMenu]
menu_bg_color = #eeeeee
menu_border_color = #979797
menu_border_width = 1
menu_border_radius = 0
menu_padding = 2
item_selected_bg_color = #ffffff
item_padding_x = 35
item_padding_y = 3
item_margin = 1
separator_bg_color = #919191
separator_height = 1
separator_margin_x = 10
separator_margin_y = 2
font_size = default
font_color = #000000
font_family = Segoe UI

[Taskbar]
border_radius_px = 10
border_width_px = 0
argb_border_color = #5BFFFFFF
argb_color = #80000000
blur_enabled = true
blur_mode = 0

[Taskbar.Geometry]
width = 100%
height = 40

[Taskbar.Position]
position_x = 50%
position_y = 100%
anchor_x = 50%
anchor_y = 100%

[Taskbar.ActiveWidgets]
active_widgets = appList, defaultClock, launchpadButton

[PowerMenu]
fullscreen = false
menu_layout = horizontal
width = 0
height = 0
double_container_bg = false
argb_double_container_color = #14ffffff
argb_background_color = #00ffffff
argb_container_color = #00666666
blur_enabled = true
blur_mode = 0
margins = 20
paddings = 20
button_size = 110
argb_border_color = #00ffffff
border_radius = 5
border_width_px = 0
spacing = 5
icons_dir = resources\pm_icons
button_color = #28000000
hover_color = #AA999999
pressed_color = #FFFFFFFF
button_border_width = 0
button_border_color = #30ffffff

[Launchpad]
fullscreen = false
fullscreen_color = #00000000
blur_enabled = true
blur_mode = 1
main_container_width = 60%
main_container_height = 70%
main_container_columns = 7
main_container_bg_color = #f0000000
main_container_border_color = #535353
main_container_border_radius = 0
main_container_border_width = 1
scroll_color = #33FFFFFF
scroll_hover_color = #66FFFFFF
scroll_border_radius = 0
scoll_width = 8
searchbar_border_width = 0
searchbar_border_radius = 0
searchbar_text_color = #FFFFFF
searchbar_text_size = 16
searchbar_default_bg_color = #22FFFFFF
searchbar_default_border_color = #77FFFFFF
searchbar_focus_bg_color = #33FFFFFF
searchbar_focus_border_color = #99FFFFFF

[Launchpad.Item]
item_container_width = 130
item_container_height = 130
item_container_border_radius = 0
item_container_border_width = 1
item_container_default_bg_color = #05ffffff
item_container_default_border_color = #00000000
item_container_hover_bg_color = #44ffffff
item_container_hover_border_color = #55ffffff
item_container_pressed_bg_color = #66FFFFFF
item_container_pressed_border_color = #77FFFFFF
item_container_icon_border_width = 0
item_container_icon_border_radius = 0
item_container_icon_bg_color = #00ffffff
item_container_icon_border_color = #0023cc94
item_icon_size = 48
item_icon_padding = 24

[Spectrum.Preferences]
sample_rate = 44100
chunk_size = 1764
bands = 240
scale = log
min_freq = 40
max_freq = 18000
sensitivity = 5
smoothing = 5
spectrum_refresh_rate = 60
physics_refresh_rate = 30
attack = 1.25
roll_off = 1
eq_start_coef = 1
eq_end_coef = 3
peak_holds_enabled = true

[Spectrum.Style]
paddings = 6
color = #8079c5ff
band_min_height = 1
peak_holds_color = #80ffffff
peak_holds_falloff = 1
peak_holds_height = 4

[Taskbar.AppList]
visible = true
position = 50%
align = 50%
icon_size = 24
paddings = 16
spacing = 2
background_color = #00000000
border_color = #FFFFFFFF
border_width = 0
radius_top_left = 0
radius_top_right = 0
radius_bottom_right = 0
radius_bottom_left = 0

[Taskbar.AppList.Button]
default_state_container_color = #01000000
hovered_state_container_color = #33FFFFFF
pressed_state_container_color = #44FFFFFF
opened_state_container_color = #01000000
opened_state_line_color = #FF888888
focus_state_container_color = #11FFFFFF
focus_state_line_color = #FF0078D7
line_width = 2
container_radius = 0
