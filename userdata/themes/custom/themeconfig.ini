[Theme]
name = Custom Theme
version = 1.0
author = Ninawe dev.
description = Standard dark theme

[Global]
font_family = resources\font\font.ttf
font_color = #FFFFFF
font_size = 11
font_shadow = True

[Desktop.System]
work_area_padding_top = 10
work_area_padding_right = 10
work_area_padding_bottom = 0
work_area_padding_left = 10

[Desktop]
wallpaper_path = resources\wallpapers
wallpaper_mode = cover
wallpaper_carousel = False
carousel_interval_min = 0.05
carousel_shuffle = False
wallpaper_transition_ms = 500
window_margin_x = 0
window_margin_y = 0
group_selection_background = #3cd7d7d7
group_selection_border = #50cccccc
group_selection_border_width = 1
group_selection_border_radius = 5

[Desktop.Icon]
bitmap_size = 48
item_width = 80
item_height = 90
spacing_x = 0
spacing_y = 0
icon_label_status = True
icon_label_font_family = Segoe UI
icon_label_font_size = 11
icon_label_compensator = 1
icon_container_border = 1
icon_container_border_radius = 5
icon_hover_background = #50d7d7d7
icon_hover_border = #50cccccc
icon_selected_background = #5ad7d7d7
icon_selected_border = #5acccccc
icon_hover_on_selected_background = #64d7d7d7
icon_hover_on_selected_border = #64cccccc
icon_drop_background = #6ed7d7d7
icon_drop_border = #6ecccccc

[ContextMenu]
menu_bg_color = #80ffffff
menu_border_color = #3c979797
menu_border_width = 1
menu_border_radius = 5
menu_padding = 2
item_selected_bg_color = #3cffffff
item_padding_x = 35
item_padding_y = 3
item_margin = 1
separator_bg_color = #80000000
separator_height = 1
separator_margin_x = 10
separator_margin_y = 2
font_size = 12
font_color = #000000
font_family = Segoe UI

[Taskbar]
border_radius_px = 10
border_width_px = 0
argb_border_color = #5BFFFFFF
argb_color = #00000000
blur_enabled = false
blur_mode = 0

[Taskbar.Geometry]
width = 100%
height = 40

[Taskbar.Position]
position_x = 50%
position_y = 100%
anchor_x = 50%
anchor_y = 100%

[Taskbar.ActiveWidgets]
active_widgets = appList

[PowerMenu]
fullscreen = true
menu_layout = vertical
width = 0
height = 0
double_container_bg = true
argb_double_container_color = #14ffffff
argb_background_color = #00ffffff
argb_container_color = #3c666666
blur_enabled = true
blur_mode = 0
margins = 20
paddings = 20
button_size = 110
argb_border_color = #00ffffff
border_radius = 5
border_width_px = 0
spacing = 5
icons_dir = resources\pm_icons
button_color = #28000000
hover_color = #AA999999
pressed_color = #FFFFFFFF
button_border_width = 0
button_border_color = #30ffffff

[Launchpad]
fullscreen = true
fullscreen_color = #01000000
blur_enabled = true
blur_mode = 0
main_container_width = 100%
main_container_height = 100%
main_container_columns = 10
main_container_bg_color = #00838383
main_container_border_color = #00535353
main_container_border_radius = 0
main_container_border_width = 0
scroll_color = #33FFFFFF
scroll_hover_color = #66FFFFFF
scroll_border_radius = 5
scoll_width = 10
searchbar_border_width = 0
searchbar_border_radius = 5
searchbar_text_color = #FFFFFF
searchbar_text_size = 16
searchbar_default_bg_color = #22FFFFFF
searchbar_default_border_color = #77FFFFFF
searchbar_focus_bg_color = #33FFFFFF
searchbar_focus_border_color = #99FFFFFF

[Launchpad.Item]
item_container_width = 130
item_container_height = 130
item_container_border_radius = 5
item_container_border_width = 1
item_container_default_bg_color = #14000000
item_container_default_border_color = #00000000
item_container_hover_bg_color = #00ffffff
item_container_hover_border_color = #80ffffff
item_container_pressed_bg_color = #66FFFFFF
item_container_pressed_border_color = #77FFFFFF
item_container_icon_border_width = 0
item_container_icon_border_radius = 5
item_container_icon_bg_color = #32000000
item_container_icon_border_color = #0023cc94
item_icon_size = 64
item_icon_padding = 12

[Spectrum.Preferences]
sample_rate = 44100
chunk_size = 1764
bands = 240
scale = log
min_freq = 20
max_freq = 18000
sensitivity = 5
smoothing = 25
spectrum_refresh_rate = 60
physics_refresh_rate = 30
attack = 1.25
roll_off = 1
eq_start_coef = 1
eq_end_coef = 3
peak_holds_enabled = false

[Spectrum.Style]
paddings = 4
color = #80abff94
band_min_height = 1
peak_holds_color = #809dff00
peak_holds_falloff = 1
peak_holds_height = 2

[Taskbar.AppList]
visible = true
position = 50%
align = 50%
icon_size = 24
paddings = 16
spacing = 1
background_color = #3C000000
border_color = #FFFFFFFF
border_width = 0
radius_top_left = 5
radius_top_right = 5
radius_bottom_right = 0
radius_bottom_left = 0

[Taskbar.AppList.Button]
default_state_container_color = #01000000
hovered_state_container_color = #40ffffff
pressed_state_container_color = #30ffffff
opened_state_container_color = #00000000
opened_state_line_color = #80ffffff
focus_state_container_color = #30ffffff
focus_state_line_color = #ffffff
line_width = 2
container_radius = 0

