[Theme]
name = Custom Theme
version = 1.0
author = Ninawe dev.
description = Standard dark theme

[Global]
font_family = resources\font\font.ttf
font_color = #FFFFFF
font_size = 11
font_shadow = True

[Desktop.System]
work_area_padding_top = 10
work_area_padding_right = 10
work_area_padding_bottom = 10
work_area_padding_left = 10

[Desktop]
wallpaper_path = resources\wallpapers
wallpaper_mode = cover
wallpaper_carousel = true
carousel_interval_min = 0.25
carousel_shuffle = False
wallpaper_transition_ms = 1000
window_margin_x = 0
window_margin_y = 0
group_selection_background = #550073ff
group_selection_border = #660073ff
group_selection_border_width = 0
group_selection_border_radius = 5

[Desktop.Icon]
bitmap_size = 48
item_width = 80
item_height = 90
spacing_x = 0
spacing_y = 0
icon_label_status = True
icon_label_font_family = Segoe UI
icon_label_font_size = 11
icon_label_compensator = 1
icon_container_border = 0
icon_container_border_radius = 3
icon_hover_background = #440073ff
icon_hover_border = #550073ff
icon_selected_background = #550073ff
icon_selected_border = #660073ff
icon_hover_on_selected_background = #660073ff
icon_hover_on_selected_border = #770073ff
icon_drop_background = #770073ff
icon_drop_border = #880073ff

[ContextMenu]
menu_bg_color = #BB111111
menu_border_color = #55FFFFFF
menu_border_width = 1
menu_border_radius = 8
menu_padding = 5
item_selected_bg_color = #44FFFFFF
item_padding_x = 30
item_padding_y = 6
item_margin = 2
separator_bg_color = #22FFFFFF
separator_height = 1
separator_margin_x = 10
separator_margin_y = 4
font_size = default
font_color = default
font_family = Segoe UI

[Taskbar]
border_radius_px = 10
border_width_px = 1
argb_border_color = #5BFFFFFF
argb_color = #80262626
blur_enabled = true
blur_mode = 0

[Taskbar.Geometry]
width = 99%
height = 35

[Taskbar.Position]
position_x = 50%
position_y = 0.5%
anchor_x = 50%
anchor_y = 0%

[Taskbar.ActiveWidgets]
active_widgets = defaultClock, launchpadButton, appList

[PowerMenu]
fullscreen = false
menu_layout = horizontal
width = 0
height = 0
double_container_bg = true
argb_double_container_color = #3cff0000
argb_background_color = #ff0000
argb_container_color = #80000000
blur_enabled = false
blur_mode = 0
margins = 15
paddings = 15
button_size = 100
argb_border_color = #000000
border_radius = 50
border_width_px = 5
spacing = 10
icons_dir = resources\pm_icons
button_color = #28000000
hover_color = #AA999999
pressed_color = #FFFFFFFF
button_border_width = 0
button_border_color = #30ffffff

[Launchpad]
fullscreen = false
fullscreen_color = #50000000
blur_enabled = false
blur_mode = 1
main_container_width = 50%
main_container_height = 60%
main_container_columns = 6
main_container_bg_color = #c8000000
main_container_border_color = #9d9d9d
main_container_border_radius = 25
main_container_border_width = 2
scroll_color = #33FFFFFF
scroll_hover_color = #66FFFFFF
scroll_border_radius = 4
scoll_width = 8
searchbar_border_width = 1
searchbar_border_radius = 10
searchbar_text_color = #FFFFFF
searchbar_text_size = 16
searchbar_default_bg_color = #22FFFFFF
searchbar_default_border_color = #7e7e7e
searchbar_focus_bg_color = #33FFFFFF
searchbar_focus_border_color = #8d8d8d

[Launchpad.Item]
item_container_width = 120
item_container_height = 140
item_container_border_radius = 15
item_container_border_width = 1
item_container_default_bg_color = #05ffffff
item_container_default_border_color = #00000000
item_container_hover_bg_color = #44ffffff
item_container_hover_border_color = #00ffffff
item_container_pressed_bg_color = #66FFFFFF
item_container_pressed_border_color = #77FFFFFF
item_container_icon_border_width = 0
item_container_icon_border_radius = 15
item_container_icon_bg_color = #22FFFFFF
item_container_icon_border_color = #0023cc94
item_icon_size = 48
item_icon_padding = 24

[Taskbar.Clock]
visible = true
font_family = resources\font\font.ttf
font_color = #ffffff
font_size = 7
font_shadow = true
width = 0
margin_left = 0
margin_right = 0
position = 99%
align = 100%
time_format = HH:mm\ndd.MM.yy

[Taskbar.AppList]
visible = True
position = 50%
align = 50%
icon_size = 20
paddings = 14
spacing = 0
background_color = #00000000
border_color = #FFFFFFFF
border_width = 0
radius_top_left = 10
radius_top_right = 10
radius_bottom_right = 10
radius_bottom_left = 10

[Taskbar.AppList.Button]
default_state_container_color = #01000000
hovered_state_container_color = #33FFFFFF
pressed_state_container_color = #44FFFFFF
opened_state_container_color = #01000000
opened_state_line_color = #404040
focus_state_container_color = #11FFFFFF
focus_state_line_color = #ffffff
line_width = 2
container_radius = 0

[Taskbar.LaunchpadButton]
visible = True
position = 0.25%
align = 0%
default = resources\images\state_default.png
hover = resources\images\state_hover.png
active = resources\images\state_active.png

[Spectrum.Preferences]
sample_rate = 44100
chunk_size = 1764
bands = 480
scale = log
min_freq = 40
max_freq = 18000
sensitivity = 5
smoothing = 15
spectrum_refresh_rate = 60
physics_refresh_rate = 30
attack = 1
roll_off = 1
eq_start_coef = 1
eq_end_coef = 3
peak_holds_enabled = true

[Spectrum.Style]
paddings = 3
color = #aaFFFFFF
band_min_height = 1
peak_holds_color = #FFFFFFFF
peak_holds_falloff = 1
peak_holds_height = 1

