[App]
language = ua

[Performance]
hardware_acceleration = true
animations_enabled = true
global_blur_enabled = true

[Theme]
current_theme = Glass
settings_theme = white

[Desktop.SystemIcons]
show_pc = true
show_trash = true

[Launchpad.Directories]
dirs = 
	C:\ProgramData\Microsoft\Windows\Start Menu\Programs
	%APPDATA%\Microsoft\Windows\Start Menu\Programs
	C:\Users\User\Documents\Программы

[Launchpad.IgnoreNames]
names = 
	uninstall
	удалить
	видалити
	uninstaller

[Launchpad.RetranslateLayouts]
layouts = 
	uk
	ru
	ua

[Hotkeys.Custom]
customs = 
	win+e, explorer.exe /e
	win+x, cmd.exe

[Hotkeys.Ninawe]
launcher_toggle = Win
powermenu_toggle = Win+Q
toggle_desktop = Win+D
run = Win+R
show_ninawe_settings = Win+N

