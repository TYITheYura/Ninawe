[App]
language = ua
version = 1.0

[Performance]
hardware_acceleration = True
animations_enabled = True
blur_enabled = True

[Theme]
current_theme = default

[Launchpad.Directories]
dirs =
    C:\ProgramData\Microsoft\Windows\Start Menu\Programs
    %APPDATA%\Microsoft\Windows\Start Menu\Programs
    C:\Users\User\Documents\Программы

[Launchpad.IgnoreNames]
names =
    uninstall
    удалить
    видалити
    uninstaller

[Launchpad.RetranslateLayouts]
layouts =
    uk
    ru
    ua

[Hotkeys.Custom]
start_file_manager = win+e, explorer.exe
start_terminal = win+x, cmd.exe

[Hotkeys.Ninawe]
launcher_toggle = Win
taskbar_toggle = Win+Shift+T
theme_next = Win+Alt+Right
theme_prev = Win+Alt+Left
shell_reload = Win+Shift+R